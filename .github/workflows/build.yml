name: KeuMusic Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - keumusic-audio-engine

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
      - name: Instalar dependencias Android
        run: sdkmanager "platforms;android-37" "cmake;3.22.1"
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compilar KeuMusic
        working-directory: KeuMusicApp
        run: ./gradlew :app:assembleGmsMobileArm64Debug
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: KeuMusic-APK
          path: KeuMusicApp/app/build/outputs/apk/gmsMobileArm64/debug/*.apk
