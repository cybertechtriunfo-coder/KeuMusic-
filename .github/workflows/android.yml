name: KeuMusic Android APK

on:
  push:
    branches:
      - keumusic-audio-engine
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - run: sdkmanager "platforms;android-37.0" "cmake;3.22.1"
      - name: Corrigir caminho do Android SDK 37
        run: |
          SDK_PLATFORMS="$ANDROID_HOME/platforms"
          ln -sfn android-37.0 "$SDK_PLATFORMS/android-37"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar KeuMusic Release ARM64
        working-directory: KeuMusicApp
        run: ./gradlew :app:assembleGmsMobileArm64Release
      - uses: actions/upload-artifact@v4
        with:
          name: KeuMusic-APK
          path: KeuMusicApp/app/build/outputs/apk/gmsMobileArm64/release/*.apk
          if-no-files-found: error
