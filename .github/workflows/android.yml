name: KeuMusic Android APK

on:
  push:
    branches:
      - keumusic-audio-engine
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-37" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar KeuMusic
        working-directory: KeuMusicApp
        run: ./gradlew :app:assembleGmsMobileArm64Debug
      - uses: actions/upload-artifact@v4
        with:
          name: KeuMusic-APK
          path: KeuMusicApp/app/build/outputs/apk/gmsMobileArm64/debug/*.apk
          if-no-files-found: error
