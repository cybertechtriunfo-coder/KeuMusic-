name: KeuMusic Debug APK (ARM64)

on:
  push:
    branches:
      - integracao-motor-video-yt-dlp-20261122
      - feature/keumusic-video-player-20261123
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keumusic-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android platform 37 and CMake
        run: |
          sdkmanager "platforms;android-37.0" "cmake;3.22.1"
          ln -sfn android-37.0 "$ANDROID_HOME/platforms/android-37"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build KeuMusic ARM64 debug APK
        working-directory: KeuMusicApp
        run: ./gradlew --no-daemon :app:assembleGmsMobileArm64Debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: KeuMusic-debug-ARM64
          path: KeuMusicApp/app/build/outputs/apk/gmsMobileArm64/debug/*.apk
          if-no-files-found: error
          retention-days: 7
