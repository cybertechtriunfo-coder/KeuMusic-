name: KeuMusic Video Integration Build

on:
  push:
    branches:
      - integracao-motor-video-yt-dlp-20261122

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android SDK and CMake
        run: sdkmanager "platforms;android-37.0" "cmake;3.22.1"
      - name: Fix Android SDK 37 platform path
        run: |
          SDK_PLATFORMS="$ANDROID_HOME/platforms"
          ln -sfn android-37.0 "$SDK_PLATFORMS/android-37"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build KeuMusic ARM64 release
        working-directory: KeuMusicApp
        run: ./gradlew :app:assembleGmsMobileArm64Release
      - uses: actions/upload-artifact@v4
        with:
          name: KeuMusic-Video-Integration-APK
          path: KeuMusicApp/app/build/outputs/apk/gmsMobileArm64/release/*.apk
          if-no-files-found: error
